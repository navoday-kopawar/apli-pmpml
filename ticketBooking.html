<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FFFAFA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Apli PMPML">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Details</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/PMPML-LOGO.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- PWA App Controller -->
    <script src="./pwa-app.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #fff;
            color: #000;
            padding-bottom: 90px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header img {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .timer {
            font-size: 18px;
            font-weight: 500;
        }


        /* Ticket Card */
        .ticket-card {
            margin: 14px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .ticket-date {
            background: #23964A;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
        }

        .ticket-body {
            padding: 22px 18px;
        }

        .route-select {
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1.5px solid #dcdcdc;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            background: #fff;
        }


        .route-select img {
            width: 36px;
            height: 36px;
        }

        .route-select input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 20px;
            color: #444;
        }

        .route-select input::placeholder {
            color: #9e9e9e;
        }


        /* Stops */
        .stops {
            display: flex;
            gap: 16px;
            margin: 28px 0;
            align-items: flex-start;
        }

        .dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 6px;
        }

        /* circles */
        .circle {
            width: 18px;
            height: 18px;
            border: 3px solid #9aa0a6;
            border-radius: 50%;
            background: white;
        }

        /* dashed connector */
        .line {
            height: 48px;
            border-left: 3px dashed #c7c7c7;
            margin: 8px 0;
        }

        /* stop labels */
        .stop-text {
            font-size: 20px;
            color: #9aa0a6;
            margin-bottom: 28px;
        }


        /* Toggle */
        .toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toggle button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
        }

        .toggle .active {
            background: #23964A;
            color: #fff;
            border-color: #23964A;
        }

        /* Tickets */
        .section-title {
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 12px;
            color: #666;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        .counter span {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }


        /* ---------- Pay Bar ---------- */
        .pay-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            padding: 12px;
            gap: 12px;
            align-items: center;
        }

        .pay-using {
            display: flex;
            flex-direction: column;
        }

        .pay-label {
            font-size: 13px;
            color: #777;
        }

        .pay-method {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pay-method img {
            width: 26px;
        }

        .pay-btn {
            flex: 1;
            background: #23964A;
            color: #fff;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            padding: 14px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <img src="./assets/back-arrow-icon.png" onclick="history.back()" alt="arrow">
            <h2>Ticket Details</h2>
        </div>
        <div class="timer" id="timer">05:00</div>
    </div>

    <!-- Ticket -->
    <div class="ticket-card">
        <div class="ticket-date" id="ticketDate"></div>


        <div class="ticket-body">

            <div class="route-select">
                <img src="./assets/green-bus-icon.png" alt="bus">
                <input type="text" placeholder="Select or enter route">
            </div>

            <div class="stops">
                <div class="dots">
                    <div class="circle"></div>
                    <div class="line"></div>
                    <div class="circle"></div>
                </div>
                <div>
                    <div class="stop-text">Starting stop</div>
                    <div class="stop-text">Ending stop</div>
                </div>
            </div>

            <div class="toggle">
                <button class="active">By Fare</button>
                <button>By Ending stop</button>
            </div>

            <div class="section-title">Ticket Price</div>
            <div class="section-title">Select Tickets</div>

            <div class="ticket-row">
                <div>Full</div>
                <div class="counter">
                    <button onclick="change('full',-1)">−</button>
                    <span id="full">1</span>
                    <button onclick="change('full',1)">+</button>
                </div>
            </div>

            <div class="ticket-row">
                <div>Half</div>
                <div class="counter">
                    <button onclick="change('half',-1)">−</button>
                    <span id="half">0</span>
                    <button onclick="change('half',1)">+</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Pay -->
    <div class="pay-bar">
        <div class="pay-using">
            <div class="pay-label">PAY USING ▲</div>
            <div class="pay-method">
                <img src="./assets/phonepay-icon.png" alt="pay">
                <span>PhonePe</span>
            </div>
        </div>
        <button class="pay-btn" id="payBtn">Pay</button>
    </div>



    <!-- Scripts -->
    <script>

        /* ================= COUNTER ================= */

        function change(type, delta) {
            const el = document.getElementById(type);
            let val = parseInt(el.innerText) + delta;
            if (val < 0) val = 0;
            el.innerText = val;
        }

        /* ================= TICKET ISSUE DATE ================= */

        const ticketDateElement = document.getElementById("ticketDate");

        let issuedTime = localStorage.getItem("ticket_issued_time");

        if (!issuedTime) {
            issuedTime = Date.now();
            localStorage.setItem("ticket_issued_time", issuedTime);
        } else {
            issuedTime = parseInt(issuedTime);
        }

        function formatTicketDate(timestamp) {
            const d = new Date(timestamp);

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? "PM" : "AM";

            hours = hours % 12 || 12;

            return `${d.getDate()} ${months[d.getMonth()]}, ${d.getFullYear()} | ${hours}:${minutes} ${ampm}`;
        }

        ticketDateElement.innerText = formatTicketDate(issuedTime);


        /* ================= TIMER SYSTEM ================= */

        const TIMER_DURATION = 300; // 5 minutes
        const timerElement = document.getElementById("timer");
        const payBtn = document.getElementById("payBtn");

        let expiryTime = localStorage.getItem("ticket_expiry");

        if (!expiryTime) {
            expiryTime = Date.now() + (TIMER_DURATION * 1000);
            localStorage.setItem("ticket_expiry", expiryTime);
        } else {
            expiryTime = parseInt(expiryTime);
        }

        function updateTimer() {
            const remaining = Math.floor((expiryTime - Date.now()) / 1000);

            if (remaining <= 0) {
                timerElement.innerText = "00:00";
                clearInterval(timerInterval);

                payBtn.innerText = "Expired";
                payBtn.style.background = "#999";
                payBtn.disabled = true;

                localStorage.removeItem("ticket_expiry");
                localStorage.removeItem("ticket_issued_time");
                return;
            }

            const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
            const seconds = String(remaining % 60).padStart(2, "0");

            timerElement.innerText = `${minutes}:${seconds}`;
        }

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);


        /* ================= PAYMENT CLICK ================= */

        payBtn.addEventListener("click", () => {
            alert("Payment Processing...");

            // simulate new ticket after payment
            localStorage.removeItem("ticket_expiry");
            localStorage.removeItem("ticket_issued_time");
        });

    </script>


</body>

</html>
